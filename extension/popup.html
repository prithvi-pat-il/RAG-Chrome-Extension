<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageGPT - Web Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="logo-wrapper">
          <img src="logo1.png" alt="PageGPT Logo" class="app-logo">
          <span class="online-indicator" id="onlineIndicator"></span>
        </div>
        <div class="header-info">
          <h2>PageGPT</h2>
          <div class="status-container" id="statusContainer">
            <span class="status-dot loading" id="statusDot"></span>
            <span class="status-text" id="statusText">Processing page...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="clearChatBtn" class="icon-btn" title="Clear conversation" aria-label="Clear chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Banner / Alert -->
    <div id="pageBanner" class="page-banner hidden">
      <span id="pageBannerText"></span>
      <button id="retryBtn" class="banner-retry-btn">Retry</button>
    </div>

    <!-- Chat Messages Container -->
    <main class="chat-body" id="chatBody">
      <div class="messages-list" id="messagesList">
        <!-- Welcome Message -->
        <div class="message-wrapper bot-message">
          <div class="avatar">
            <img src="logo1.png" alt="AI Avatar">
          </div>
          <div class="message-content">
            <div class="bubble">
              <p>👋 Hello! I'm ready to answer any questions about the content of this webpage.</p>
            </div>
            <!-- Quick Suggestion Chips -->
            <div class="suggestion-chips" id="suggestionChips">
              <button class="chip" data-prompt="Summarize this page in 3 key bullet points.">📝 Summarize page</button>
              <button class="chip" data-prompt="What are the key takeaways from this page?">🔑 Key takeaways</button>
              <button class="chip" data-prompt="Explain the main topic of this page in simple terms.">💡 Explain simply</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Chat Input Footer -->
    <footer class="chat-footer">
      <div class="input-container">
        <textarea 
          id="questionInput" 
          placeholder="Ask anything about this page..." 
          rows="1"
          disabled
        ></textarea>
        <button id="sendBtn" class="send-btn" disabled aria-label="Send question">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="footer-hint">
        <span>Press <kbd>Enter</kbd> to send, <kbd>Shift+Enter</kbd> for newline</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
